{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:620px;margin:auto">
<h2>Report an incident or early sign of conflict</h2>
<p style="color:var(--muted)">Your phone number is encrypted and only used to follow up. Tick "anonymous" to leave it out.
No smartphone? Send SMS: <b>AP &lt;LGA&gt; CROP &lt;details&gt;</b> or dial the USSD code.</p>
<form method="post">
<p><label>LGA</label><select name="lga" required>{% for l in lgas %}<option>{{ l }}</option>{% endfor %}</select></p>
<p><label>What happened?</label><select name="type">{% for k,v in types.items() %}<option value="{{ k }}">{{ v[0] }}</option>{% endfor %}</select></p>
<p><label>Details (place, time, number of cattle or people)</label><textarea name="description" rows="3" maxlength="500"></textarea></p>
<p><label>Fatalities (if any)</label><input name="fatalities" type="number" min="0" max="500" value="0"></p>
<p style="display:flex;gap:8px"><input name="lat" placeholder="Latitude (optional)"><input name="lon" placeholder="Longitude (optional)">
<button type="button" onclick="navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude.toFixed(5);lon.value=p.coords.longitude.toFixed(5)})">Use my location</button></p>
<p><label>Phone (optional)</label><input name="phone" placeholder="080..."></p>
<p><label><input type="checkbox" name="anonymous" style="width:auto"> Report anonymously</label></p>
<input name="website" style="display:none" tabindex="-1" autocomplete="off">
<button>Submit report</button></form></div>
{% endblock %}
