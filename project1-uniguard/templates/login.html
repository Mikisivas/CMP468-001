{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:380px;margin:60px auto">
<h2>Sign in</h2>
<form method="post">
<p><input name="username" placeholder="Username" required style="width:100%"></p>
<p><input name="password" type="password" placeholder="Password" required style="width:100%"></p>
<button type="submit">Login</button>
</form>
<p style="color:var(--muted);font-size:12px">Passwords are stored as PBKDF2-SHA256 hashes. 5 failed attempts lock the IP for 5 minutes.</p>
</div>
{% endblock %}
