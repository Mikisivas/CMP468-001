<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniGuard | {{ institution }}</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--accent:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:#020617;border-bottom:1px solid #334155}
header b{color:var(--accent)}nav a{color:var(--text);margin-right:14px;text-decoration:none}nav a:hover{color:var(--accent)}
main{padding:20px;max-width:1300px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border-radius:10px;padding:16px;border:1px solid #334155}
.card h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.big{font-size:28px;font-weight:700}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid #334155;text-align:left}
th{color:var(--muted)}button,.btn{background:var(--accent);color:#020617;border:0;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer}
button.danger{background:var(--bad);color:#fff}input,select{padding:7px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:var(--text)}
.flash{background:#1d4ed8;padding:10px;border-radius:6px;margin-bottom:12px}
.pill{padding:2px 8px;border-radius:10px;font-size:12px}.pill.critical{background:var(--bad)}.pill.warning{background:var(--warn);color:#000}.pill.info{background:#475569}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}.row>.card{flex:1 1 420px}
</style>
</head>
<body>
<header><div><b>UniGuard</b> &middot; Monitoring, Backup &amp; Recovery &middot; {{ institution }}</div>
{% if user %}<nav><a href="/">Dashboard</a><a href="/snapshots">Backups &amp; Restore</a><a href="/audit">Audit log</a>
<a href="/logout">Logout ({{ user }}, {{ role }})</a></nav>{% endif %}</header>
<main>
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
{% block body %}{% endblock %}
</main>
</body></html>
